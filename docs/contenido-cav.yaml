worked_example:
  titulo: "Caída en un descenso, terreno de bloques"
  pausa:
    pregunta: "¿Qué observarías antes de tocar?"
    revela: "Sin tocarla: respira pero no responde a tu voz; la piel está pálida. Esa impresión general (TEV) te da la gravedad antes de entrar al HABCDE."
  steps:
    - {fase: "escena", estado: "Tu compañero cae varios metros en un canal de pedrero y queda tendido.", accion: "1 · Seguridad: te detenés y pensás; mirás el terreno (bloques sueltos, caída de piedras), asegurás la zona y te ponés guantes antes de acercarte.", racional_ref: "scene"}
    - {fase: "escena", estado: "Cayó golpeando contra las rocas, unos 5 m (más de 2 veces su altura).", accion: "2 · Mecanismo: caída de más de 2-3 veces la altura del cuerpo contra rocas → sospechás lesiones graves y trauma de columna.", racional_ref: "mdd"}
    - {fase: "escena", estado: "Dos compañeros cerca; el resto de la cordada por encima.", accion: "3 · Número de víctimas y recursos: una víctima, dos compañeros que pueden ayudar. Delegás la llamada al 107 / ayuda externa y seguís.", racional_ref: "scene"}
    - {fase: "escena", estado: "Te acercás con seguridad.", accion: "4 · Impresión general (TEV) sin tocar: no responde, respira, piel pálida.", racional_ref: "tev"}
    - {fase: "primaria", estado: "No responde, respira; sangrado pulsátil en el muslo; casco puesto.", accion: "H: controlás la hemorragia masiva con presión directa antes que nada; si no cede en minutos, torniquete a 5-8 cm y anotás la hora.", racional_ref: "habcde"}
    - {fase: "primaria", estado: "Hemorragia controlada; hay mecanismo de trauma.", accion: "A: abrís la vía aérea con subluxación mandibular (control cervical); un compañero sostiene la cabeza.", racional_ref: "habcde"}
    - {fase: "primaria", estado: "Respira sin esfuerzo, no responde.", accion: "B: respira normal. Como hay sospecha de columna no lo ponés en PLS: boca arriba, cabeza inmovilizada, y controlás cambios.", racional_ref: "habcde"}
    - {fase: "primaria", estado: "Sin otros sangrados visibles; piel pálida y fría.", accion: "C: revisás rápido de cabeza a pies (la ropa abultada puede esconder sangre): nada más. Piel pálida y fría → alerta de shock.", racional_ref: "shock"}
    - {fase: "primaria", estado: "Empieza a quejarse ante la voz.", accion: "D: responde a estímulo verbal (V); mantenés la columna inmovilizada.", racional_ref: "habcde"}
    - {fase: "primaria", estado: "Hace frío y está sobre las rocas.", accion: "E: exponés rápido buscando lesiones ocultas y lo abrigás: perdió sangre y está en el suelo, se enfría más.", racional_ref: "habcde"}
    - {fase: "secundaria", estado: "Responde a la voz, confuso; pálido, frío y húmedo; dolor abdominal.", accion: "Línea de base de signos vitales con hora; es inestable → reevaluás cada 5 min. Fue trauma: examen físico (DIAS) de cabeza a pies. Reconocés el shock por la piel.", racional_ref: "signos_vitales"}
    - {fase: "evacuacion", estado: "Shock con sospecha de sangrado interno, zona remota a 2 h.", accion: "Decidís evacuación CRÍTICA: el sangrado interno no se resuelve en el terreno. Lo mantenés abrigado y en posición cómoda, registrás todo en la ficha SOAP y confirmás la ayuda externa.", racional_ref: "shock"}
